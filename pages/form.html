<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        <link rel="stylesheet" href="../styles/style.css">
        <title>Formulario de Contacto</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">Mi Perfil</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link" href="form.html">Contáctame</a>
                </li>
                <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Desactivado</a>
                </li>
            </ul>
            </div>
        </div>
        </nav>
        <center>
            <br>
        <h1>Contáctame</h1>
        <form id="Miformulario">
            <label>Nombre</label>
            <input type="text" name="Minombre" required><br><br>
            <label>Email</label>
            <input type="email" name="Micorreo" required><br><br>
            <p>Género</p>
            <input type="radio" name="Migenero" value="Hombre" required>
            <label>Hombre</label><br>
            <input type="radio" name="Migenero" value="Mujer" required>
            <label>Mujer</label>
            <br><br>
            <button type="submit">Enviar</button>
        </form>

        <div id="resultado" style="margin-top: 20px; color: blue"></div>
        </center>

        <script>
            const formulario = document.getElementById("Miformulario");
            const visor = document.getElementById("resultado");

            formulario.addEventListener("submit", function (event) {
                event.preventDefault();

                const datos = new FormData(formulario);
                const nombre = datos.get("Minombre");
                const email = datos.get("Micorreo");
                const genero = datos.get("Migenero");

                visor.innerText =
                "Nombre: " + nombre +
                "\nCorreo: " + email +
                "\nGénero: " + genero;

            });
        </script>
                <footer style="display: flex; justify-content: center">
            Raul Martínez 2026
        </footer>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
crossorigin="anonymous"></script>
</html>
